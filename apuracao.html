<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Apuração — Urna Escolar</title>
<link rel="stylesheet" href="css/urna.css">
<link rel="stylesheet" href="css/admin.css">
  <link rel="stylesheet" href="css/apuracao.css">
<style>
  .apu-wrap { max-width: 760px; margin: 0 auto; }
  .bloqueio {
    background: var(--surf); border: 2px dashed var(--line); border-radius: 14px;
    padding: 40px 24px; text-align: center;
  }
  .bloqueio h2 { font-size: 32px; margin-bottom: 12px; }
  .bloqueio p { color: var(--mut); margin: 0; }
  .vencedor {
    background: linear-gradient(135deg, var(--acc), #ffcf3f);
    color: #14213d; border-radius: 14px; padding: 24px; text-align: center;
    margin-bottom: 20px;
  }
  .vencedor .label { font: 700 14px "Barlow Condensed", sans-serif;
    letter-spacing: .1em; text-transform: uppercase; opacity: .75; }
  .vencedor .nome  { font: 800 40px "Barlow Condensed", sans-serif; line-height: 1.1; margin: 6px 0; }
  .vencedor .num   { font: 800 24px "Barlow Condensed", sans-serif; opacity: .8; }

  .resultado { background: var(--surf); border: 1px solid var(--line); border-radius: 14px;
    padding: 20px; margin-bottom: 16px; }
  .resultado h2 { font-size: 24px; margin-bottom: 14px; }

  .linha { display: grid; grid-template-columns: 48px 1fr auto; gap: 12px;
    align-items: center; margin: 10px 0; }
  .linha .num { font: 800 24px "Barlow Condensed", sans-serif; text-align: center; }
  .linha .barra-wrap { position: relative; }
  .linha .nome { font-weight: 700; margin-bottom: 4px; font-size: 15px; }
  .linha .barra { height: 22px; background: var(--line); border-radius: 11px; overflow: hidden; }
  .linha .barra i { display: block; height: 100%; transition: width 1.2s cubic-bezier(.2,.7,.3,1); }
  .linha .votos { font: 800 24px "Barlow Condensed", sans-serif; min-width: 60px; text-align: right; }
  .linha .pct { font-size: 13px; color: var(--mut); }

  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 12px; margin-bottom: 16px; }
  .stat { background: var(--surf); border: 1px solid var(--line); border-radius: 12px;
    padding: 14px; text-align: center; }
  .stat .n { font: 800 34px "Barlow Condensed", sans-serif; line-height: 1; }
  .stat .l { font-size: 12px; color: var(--mut); text-transform: uppercase; letter-spacing: .08em; margin-top: 4px; }

  .voltar-link { display: inline-block; margin-top: 20px; color: var(--mut); font-size: 14px; }
</style>
</head>
<body>

<header>
  <div>
    <b id="escola">Urna Digital Escolar</b><br>
    <span>Apuração oficial <span id="ano"></span></span>
  </div>
  <span id="status">—</span>
</header>

<main>
  <div class="apu-wrap" id="conteudo">
    <div class="bloqueio">
      <h2>Carregando apuração…</h2>
    </div>
  </div>
  <p class="center" style="margin-top:24px">
    <a class="voltar-link" href="index.html">← Voltar à urna</a>
  </p>
</main>

<div class="foot">Sistema escolar de votação. Interface independente, sem vínculo com a Justiça Eleitoral.</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/apuracao.js"></script>
</body>
</html>
