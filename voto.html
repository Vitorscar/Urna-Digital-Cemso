<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#14213d">
<meta name="robots" content="noindex">
<title>Votação — Urna Escolar</title>
<link rel="stylesheet" href="css/urna.css">
<link rel="stylesheet" href="css/urna-membros.css">
</head>
<body>

<header>
  <div>
    <b id="escola">Urna</b><br>
    <span>Eleição do Grêmio <span id="ano"></span></span>
  </div>
  <span>Voto</span>
</header>

<main>
  <noscript>
    <p class="msg err">Ative o JavaScript do navegador para votar.</p>
  </noscript>

  <div class="urna">

    <!-- Tela da urna -->
    <section class="display" aria-live="polite" aria-label="Tela da urna">
      <div class="tag">Seu voto para</div>
      <h2 class="display-titulo">Grêmio Estudantil</h2>
      <div class="digits" id="digits" aria-label="Número digitado"></div>
      <div class="chapa-view" id="chapaView">
        <div class="hint">DIGITE O NÚMERO DA CHAPA</div>
      </div>
    </section>

    <!-- Teclado -->
    <section class="keys" aria-label="Teclado da urna">
      <div class="grid" id="teclado"></div>
      <div class="acts">
        <button type="button" class="k w" id="kBranco">BRANCO</button>
        <button type="button" class="k c" id="kCorrige">CORRIGE</button>
        <button type="button" class="k f" id="kConfirma" disabled>CONFIRMA</button>
      </div>
    </section>

  </div>
</main>

<div class="foot">Sistema escolar de votação.</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/state.js"></script>
<script src="js/audio.js"></script>
<script src="js/chapa-view.js"></script>
<script src="js/voto.js"></script>
</body>
</html>
